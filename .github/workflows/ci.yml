name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

# Steps marked `if: false` are waiting on a later milestone (docs/09-milestones.md).
# Remove the condition when the milestone lands.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # @kerb/tokens publishes its types from dist (tokens.d.ts), and code that
      # imports it cannot be typechecked until that exists
      - name: Build tokens
        run: pnpm --filter @kerb/tokens build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (tokens, react, storybook, docs)
        run: pnpm build

      - name: Unit tests (includes token contrast)
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Every story with axe in light, dark and comfort (Storybook Vitest addon)
      - name: Story accessibility tests
        run: pnpm test:a11y

      - name: End to end tests
        id: e2e
        run: pnpm test:e2e

      # Every docs page: axe in all three themes, 400% zoom, text spacing,
      # the comfort theme at 200%, and the site's own keyboard flows
      - name: Docs checks
        run: pnpm test:docs

      # The passports show numbers from these runs. Fails when the committed
      # numbers no longer match (run the tests and `pnpm passports`, then commit)
      - name: Passport numbers match this run
        run: node scripts/passport-stats.ts --check

      # The portfolio's project modal, built with Dialog and Tabs
      - name: Portfolio demo tests
        run: pnpm test:portfolio

      # Budget: the 1.0.0 build plus 10% (package.json "size-limit")
      - name: Bundle size
        run: pnpm size

      - name: Upload Playwright report
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Changesets, without publishing. npm publishing is off for now (docs/10-release.md):
  # with changesets waiting, this opens or updates a "Release: version packages"
  # pull request, and merging it only bumps versions and changelogs.
  # To publish later: add `publish: pnpm changeset publish` to the changesets
  # step, the NPM_TOKEN secret, and the env lines noted below.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `publish` input: nothing is ever sent to npm from here
      - name: Version pull request
        uses: changesets/action@v1
        with:
          title: "Release: version packages"
          commit: "Release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When publishing is turned on, also add: NPM_TOKEN and NODE_AUTH_TOKEN
          # (both secrets.NPM_TOKEN), NPM_CONFIG_PROVENANCE (true for a public
          # repository), `registry-url` on setup-node, `id-token: write` above,
          # and a build of the packages before this step

  # Storybook on GitHub Pages, from main
  storybook:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Storybook and the packages it needs (tokens, react)
      - run: pnpm --filter "kerb-storybook..." build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/storybook/storybook-static

      - id: deploy
        uses: actions/deploy-pages@v4
